name: Release IPA - Direct Download for Esign

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (vd: v3.0)'
        required: true
        default: 'v3.0'

jobs:
  build:
    name: Build & Release
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install make cmake wget coreutils

      - name: Install ldid
        run: |
          curl -Lo /tmp/ldid https://github.com/itsnebulalol/ldid-macos/releases/latest/download/ldid
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid --version || echo "ldid installed"

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          architecture: x64

      - name: Build IPA
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/bin:/usr/local/bin:$JAVA_HOME/bin:$PATH"
          export SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export BOOTJDK=$JAVA_HOME/bin
          echo "JAVA_HOME=$JAVA_HOME"
          echo "BOOTJDK=$BOOTJDK"
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2

      - name: Build TIPA (TrollStore)
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/bin:/usr/local/bin:$JAVA_HOME/bin:$PATH"
          export SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export BOOTJDK=$JAVA_HOME/bin
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "Btn Launcher ${{ github.event.inputs.version }}"
          body: |
            # Btn Launcher iOS ${{ github.event.inputs.version }}

            ## Hướng dẫn cài đặt qua Esign:
            1. Tải file **BtnLauncher.ipa** bên dưới
            2. Mở **Esign** → Import → chọn file IPA
            3. **Sign** và **Install**

            ## Dùng TrollStore (không cần sign):
            Tải file **BtnLauncher.tipa** → mở trong TrollStore → Install

            ## Yêu cầu:
            - iOS 14.0+
            - iPhone/iPad
            - Cần JIT để chạy (TrollStore có JIT tự động)
          files: |
            artifacts/com.btnlauncher.ios-*-ios.ipa
            artifacts/com.btnlauncher.ios-*-ios-trollstore.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
