name: Release IPA - Direct Download for Esign

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (vd: v3.0)'
        required: true
        default: 'v3.0'

jobs:
  build:
    name: Build & Release
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install dependencies
        run: |
          brew update
          brew install make cmake wget coreutils ldid openjdk@8

      - name: Build IPA
        run: |
          export PATH="/opt/homebrew/opt/openjdk@8/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export BOOTJDK=/opt/homebrew/opt/openjdk@8/bin
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2

      - name: Build TIPA (TrollStore)
        run: |
          export PATH="/opt/homebrew/opt/openjdk@8/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export BOOTJDK=/opt/homebrew/opt/openjdk@8/bin
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: List artifacts
        run: |
          ls -la artifacts/
          echo "IPA_PATH=$(ls artifacts/*.ipa | head -1)" >> $GITHUB_ENV
          echo "TIPA_PATH=$(ls artifacts/*.tipa | head -1)" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "Btn Launcher ${{ github.event.inputs.version }}"
          body: |
            # Btn Launcher iOS ${{ github.event.inputs.version }}

            ## Hướng dẫn cài đặt qua Esign:
            1. Tải file **BtnLauncher.ipa** bên dưới
            2. Mở **Esign** → Import → chọn file IPA
            3. **Sign** và **Install**

            ## Dùng TrollStore (không cần sign):
            Tải file **BtnLauncher.tipa** → mở trong TrollStore → Install

            ## Yêu cầu:
            - iOS 14.0+
            - iPhone/iPad
            - Cần JIT để chạy (TrullStore có JIT tự động, Esign cần kích hoạt JIT riêng)
          files: |
            artifacts/*.ipa
            artifacts/*.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
