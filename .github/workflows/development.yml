name: Build IPA for Esign

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    name: Build Btn Launcher IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install build tools
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install make cmake wget coreutils

      - name: Install ldid
        run: |
          curl -sL -o /tmp/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64"
          chmod +x /tmp/ldid
          sudo cp /tmp/ldid /usr/local/bin/ldid
          ldid -v || echo "ldid OK"

      - name: Build IPA
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/bin:/usr/local/bin:$JAVA_HOME/bin:$PATH"
          export SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export BOOTJDK=$JAVA_HOME/bin
          echo "=== DEBUG ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "BOOTJDK=$BOOTJDK"
          echo "SDKPATH=$SDKPATH"
          echo "which cmake: $(which cmake)"
          echo "which ldid: $(which ldid)"
          echo "which wget: $(which wget)"
          echo "which gmake: $(which gmake)"
          echo "============="
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2

      - name: Build TIPA (TrollStore)
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:/opt/homebrew/bin:/usr/local/bin:$JAVA_HOME/bin:$PATH"
          export SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export BOOTJDK=$JAVA_HOME/bin
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Upload IPA
        uses: actions/upload-artifact@main
        with:
          name: BtnLauncher.ipa
          path: artifacts/com.btnlauncher.ios-*-ios.ipa

      - name: Upload TIPA
        uses: actions/upload-artifact@main
        with:
          name: BtnLauncher.tipa
          path: artifacts/com.btnlauncher.ios-*-ios-trollstore.tipa
